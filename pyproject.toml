[tool.poetry]
name = "pulsestream"
version = "1.0.0"
description = "Enterprise Real-Time Event & Webhook Orchestrator built with Django 5.x and Channels"
authors = ["PulseStream Engineering <engineering@pulsestream.io>"]

[tool.black]
line-length = 100
target-version = ['py312']
exclude = '''
/(
    \.git
  | \.venv
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "--tb=short -ra"
