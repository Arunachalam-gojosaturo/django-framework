<div class="p-5 rounded-2xl bg-slate-900/70 border border-slate-800 shadow-sm relative overflow-hidden">
    <div class="flex items-center justify-between">
        <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">{{ title }}</span>
        <span class="p-2 rounded-lg bg-indigo-500/10 text-indigo-400">
            {{ icon|safe }}
        </span>
    </div>
    <div class="mt-3 flex items-baseline gap-2">
        <span class="text-3xl font-extrabold text-white font-mono">{{ value }}</span>
        <span class="text-xs text-indigo-400 font-medium">{{ subtitle }}</span>
    </div>
</div>
