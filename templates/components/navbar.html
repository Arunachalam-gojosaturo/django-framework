<header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
            <!-- Brand Logo & Name -->
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-cyan-400 flex items-center justify-center shadow-lg shadow-indigo-500/20">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                    </svg>
                </div>
                <div>
                    <a href="/" class="text-lg font-bold tracking-tight text-white flex items-center gap-2">
                        PulseStream
                        <span class="text-[10px] font-semibold uppercase tracking-wider px-2 py-0.5 rounded-full bg-indigo-500/20 text-indigo-400 border border-indigo-500/30">v1.0-prod</span>
                    </a>
                </div>
            </div>

            <!-- Navigation Links & Status -->
            <div class="flex items-center space-x-4">
                <!-- Live WebSocket Connectivity Indicator -->
                <div class="flex items-center space-x-2 px-3 py-1.5 rounded-full bg-slate-800/80 border border-slate-700/80 text-xs">
                    <span class="relative flex h-2 w-2">
                        <span x-show="wsConnected" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span :class="wsConnected ? 'bg-emerald-500' : 'bg-rose-500'" class="relative inline-flex rounded-full h-2 w-2"></span>
                    </span>
                    <span x-text="wsConnected ? 'Stream Active' : 'Connecting...'" :class="wsConnected ? 'text-emerald-400 font-medium' : 'text-slate-400'"></span>
                </div>

                <a href="/api/docs/" target="_blank" class="text-sm font-medium text-slate-300 hover:text-white px-3 py-1.5 rounded-lg hover:bg-slate-800 transition">
                    API Reference
                </a>

                <a href="/admin/" class="text-sm font-medium text-slate-300 hover:text-white px-3 py-1.5 rounded-lg hover:bg-slate-800 transition">
                    Admin
                </a>
            </div>
        </div>
    </div>
</header>
